name: CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Verify repository workflow
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Verify shell scripts
        run: |
          chmod +x build.sh common.sh patch.sh
          bash -n build.sh
          bash -n common.sh
          bash -n patch.sh
          echo "Workflow executed successfully on $(date -u +"%Y-%m-%dT%H:%M:%SZ")"
